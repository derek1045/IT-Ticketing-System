version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ticket-db
    environment:
      POSTGRES_DB: t_s
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Biodude1
    ports:
      - "1234:1234"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    container_name: ticket-backend
    build: ./backend
    ports:
      - "1234:1234"
    environment:
      DB_HOST: db
      DB_PORT: 1234
      DB_NAME: t_s
      DB_USER: postgres
      DB_PASSWORD: Biodude1
    depends_on:
      - db

volumes:
  db_data:
